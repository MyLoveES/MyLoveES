<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">MyLoveES — Code / Experiment / Play</title>
  <desc id="description">A midnight navy portfolio banner with sparse teal and warm gold bullet patterns. Python, C++, R.</desc>
  <defs>
    <clipPath id="canvas">
      <rect width="960" height="300" rx="18"/>
    </clipPath>
    <g id="teal-bullet">
      <ellipse rx="3.1" ry="7" fill="#79DED1" fill-opacity="0.08" stroke="#79DED1" stroke-width="1.1"/>
      <ellipse rx="0.8" ry="2.4" fill="#A4F0E4" fill-opacity="0.8"/>
    </g>
    <g id="gold-bullet">
      <ellipse rx="2.6" ry="6.2" fill="#E9BD79" fill-opacity="0.12" stroke="#E9BD79" stroke-width="1"/>
      <ellipse rx="0.6" ry="1.9" fill="#F4D7AA" fill-opacity="0.85"/>
    </g>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="960" height="300" fill="#0D1925"/>
    <rect x="0.5" y="0.5" width="959" height="299" rx="17.5" fill="none" stroke="#293A48"/>

    <!-- A quiet baseline keeps the typography anchored. -->
    <path d="M56 220H460" fill="none" stroke="#2A3C49" stroke-width="1"/>
    <rect x="56" y="53" width="26" height="3" rx="1.5" fill="#79DED1"/>
    <circle cx="91" cy="54.5" r="1.5" fill="#E9BD79"/>

    <text x="53" y="137" fill="#EDF3F2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="650" letter-spacing="-2.7">MyLoveES</text>
    <text x="57" y="177" fill="#A1B5BD" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="400" letter-spacing="2">CODE / EXPERIMENT / PLAY</text>
    <text x="57" y="253" fill="#7D969F" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="400" letter-spacing="1.4">PYTHON · C++ · R</text>

    <!-- Three open arcs suggest a sparse danmaku pattern without animation. -->
    <g fill="none" stroke="#79DED1" stroke-width="0.8" stroke-opacity="0.11">
      <path d="M609 94C663 20 774 7 850 60C883 83 904 116 914 151"/>
      <path d="M652 124C692 69 768 56 821 92C847 110 864 134 871 161"/>
      <path d="M696 152C722 118 763 109 794 129C809 139 819 153 825 169"/>
    </g>

    <!-- Outer formation. -->
    <g opacity="0.77">
      <use href="#teal-bullet" transform="translate(617 84) rotate(-53)"/>
      <use href="#teal-bullet" transform="translate(662 43) rotate(-32)"/>
      <use href="#teal-bullet" transform="translate(720 25) rotate(-10)"/>
      <use href="#teal-bullet" transform="translate(781 29) rotate(12)"/>
      <use href="#teal-bullet" transform="translate(839 53) rotate(34)"/>
      <use href="#teal-bullet" transform="translate(886 94) rotate(55)"/>
      <use href="#teal-bullet" transform="translate(912 144) rotate(75)"/>
    </g>

    <!-- Middle formation. -->
    <g opacity="0.95">
      <use href="#teal-bullet" transform="translate(657 117) rotate(-53)"/>
      <use href="#teal-bullet" transform="translate(690 86) rotate(-31)"/>
      <use href="#teal-bullet" transform="translate(733 73) rotate(-8)"/>
      <use href="#teal-bullet" transform="translate(776 75) rotate(14)"/>
      <use href="#teal-bullet" transform="translate(815 89) rotate(35)"/>
      <use href="#teal-bullet" transform="translate(848 121) rotate(57)"/>
      <use href="#teal-bullet" transform="translate(869 154) rotate(76)"/>
    </g>

    <!-- Inner formation. -->
    <g opacity="0.7">
      <use href="#teal-bullet" transform="translate(701 145) rotate(-51)"/>
      <use href="#teal-bullet" transform="translate(728 124) rotate(-24)"/>
      <use href="#teal-bullet" transform="translate(762 119) rotate(4)"/>
      <use href="#teal-bullet" transform="translate(793 129) rotate(33)"/>
      <use href="#teal-bullet" transform="translate(818 154) rotate(63)"/>
    </g>

    <!-- A second, warmer stream adds a small counterpoint. -->
    <path d="M654 264C710 227 796 204 901 215" fill="none" stroke="#E9BD79" stroke-width="0.8" stroke-opacity="0.13"/>
    <g opacity="0.86">
      <use href="#gold-bullet" transform="translate(665 257) rotate(54)"/>
      <use href="#gold-bullet" transform="translate(707 235) rotate(67)"/>
      <use href="#gold-bullet" transform="translate(753 220) rotate(77)"/>
      <use href="#gold-bullet" transform="translate(801 213) rotate(86)"/>
      <use href="#gold-bullet" transform="translate(850 212) rotate(94)"/>
      <use href="#gold-bullet" transform="translate(895 214) rotate(97)"/>
    </g>

    <!-- Deliberate negative space separates the name from the pattern. -->
    <g fill="#6C8996" fill-opacity="0.38">
      <circle cx="565" cy="153" r="1"/>
      <circle cx="607" cy="236" r="1"/>
      <circle cx="901" cy="268" r="1"/>
      <circle cx="928" cy="38" r="1"/>
    </g>
  </g>
</svg>
